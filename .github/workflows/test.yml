name: test
on: [push, pull_request]
jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 93cb12f = firmware 2.0.0 (the Dockerfile default), 7ac453b = 2.1.0 (current release, upstream main)
        ref: [93cb12faebf6e74c51bbc5f0be66e95124af14c8, 7ac453b50fe6779b2ec0b759038a17da5e6d671d]
    steps:
      - uses: actions/checkout@v4
      - name: Stock-firmware workaround post-processor
        run: python3 -m unittest tests.test_fan_m400
      - name: Build the U1 firmware runner at ${{ matrix.ref }}
        run: docker build --build-arg U1_KLIPPER_REF=${{ matrix.ref }} -t u1-fixpack:local .
      - name: Run issue regressions
        env:
          FIXPACK_FIRMWARE: ${{ matrix.ref }}
        run: |
          python3 tests/run_issue22.py
          python3 tests/run_issue18.py
          python3 tests/run_toolchange_fan.py
          python3 tests/run_fan_m400.py
          python3 tests/run_start_line.py
      - name: Full print, real Pause/Resume (stock red, patched green, mutants red)
        run: sh tests/prove.sh u1-fixpack:local
